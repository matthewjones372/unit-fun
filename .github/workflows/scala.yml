name: Scala CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: namespace-profile-mattjones372
    steps:
      - uses: actions/checkout@v2
      - name: Run tests
        run: sbt test
  lint:
    runs-on: namespace-profile-mattjones372
    steps:
      - uses: actions/checkout@v2
      - name: Formatting
        run: sbt scalafmtSbtCheck scalafmtCheck test:scalafmtCheck

name: Scala CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      # GitHub's runner has neither sbt nor a pinned JDK; the Namespace image had both.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Run tests
        run: sbt test
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      # GitHub's runner has neither sbt nor a pinned JDK; the Namespace image had both.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Formatting
        run: sbt scalafmtSbtCheck scalafmtCheck test:scalafmtCheck
